Research Experience:
  - company: University of Oxford
    position: MSc Research Project — Free Fermions in Disguise
    start_date: 2025-11
    end_date: 2026-06
    location: Oxford, England
    summary: "Supervised by Prof. Paul Fendley."
    highlights:
      - "Studied free-fermion-in-disguise (FFD) models: spin systems with free-fermionic spectra that do not admit local Jordan–Wigner transformations."
      - "Investigated graph-theoretic solvability conditions for these models using numerical and graphical methods."
      - "Studied connections between supersymmetry in these models and graph-theoretic problems."

  - company: Research Project
    position: Sensing High-Frequency AC Fields
    start_date: 2025-06
    end_date: 2026-01
    summary: "Supervised by Prof. Adam Zaman Chaudhary."
    highlights:
      - "Studied sensing AC fields using a multi-qubit probe and determined precision limits using a one-axis-twisting Hamiltonian with transverse field."
      - "Demonstrated a fourth-order improvement in Quantum Fisher Information as the angular momentum of the system is increased."

  - company: Research Project
    position: Particle Production Through a Cosmological Bounce
    start_date: 2024-06
    end_date: 2026-07
    summary: "Supervised by Dr. Mustafa Saeed; collaborator: Irfan Javed."
    highlights:
      - "Modeled particle production across a bouncing universe using quantum field theory in curved spacetime."
      - "Extended the formalism to include backreaction of quantum matter on the spacetime background."
      - "Found that particle creation peaks at the bounce and approaches a near-thermal spectrum at late times."
      - "Identified a spectral signature not obtained in classical cosmology."
      - "Manuscript submitted to Physical Review D; preprint available on arXiv."

