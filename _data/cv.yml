Research Experience:
  - company: University of Oxford
    position: MSc Research Project — Free Fermions in Disguise
    location: Oxford, England
    start_date: 2025-11
    end_date: 2026-06
    summary: >
      Research project supervised by Prof. Paul Fendley studying free
      fermions in disguise (FFD) models and their graph-theoretic
      structure.
    highlights:
      - "Studied spin systems with free-fermionic spectra that do not admit local Jordan–Wigner transformations."
      - "Investigated graph-theoretic solvability conditions for FFD models using numerical and graphical methods."
      - "Studied connections between supersymmetry in these models and graph-theoretic problems."

  - company: Research Project
    position: Sensing High-Frequency AC Fields
    start_date: 2025-06
    end_date: 2026-01
    summary: >
      Research project supervised by Prof. Adam Zaman Chaudhary on
      quantum metrology with multi-qubit probes.
    highlights:
      - "Studied sensing of AC fields using a multi-qubit probe and determined precision limits using a one-axis twisting with transverse-field Hamiltonian."
      - "Demonstrated a fourth-order improvement in Quantum Fisher Information with increasing angular momentum, surpassing conventional quantum-metrology limits."

  - company: Research Project
    position: Particle Production Through a Cosmological Bounce
    start_date: 2024-06
    end_date: 2026-07
    summary: >
      Research project supervised by Dr. Mustafa Saeed, with Irfan Javed
      as collaborator, studying particle production in a bouncing universe
      using quantum field theory in curved spacetime.
    highlights:
      - "Modeled particle production across a cosmological bounce and incorporated backreaction of quantum matter on the spacetime background."
      - "Found that particle creation peaks near the bounce and approaches a near-thermal spectrum at late times."
      - "Identified a spectral signature absent in classical cosmology."
      - "Manuscript submitted to Physical Review D; preprint available on arXiv."

